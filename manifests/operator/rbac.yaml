apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-healing-operator
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auto-healing-operator
rules:
  # Read pods and deployments across all namespaces
  - apiGroups: [""]
    resources: [pods, pods/status, events, nodes]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/status, replicasets]
    verbs: [get, list, watch, patch, update]
  # kopf needs these to store its own state
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [kopf.dev]
    resources: [clusterkopfpeerings]
    verbs: [get, list, watch, patch, update]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auto-healing-operator
subjects:
  - kind: ServiceAccount
    name: auto-healing-operator
    namespace: demo
roleRef:
  kind: ClusterRole
  name: auto-healing-operator
  apiGroup: rbac.authorization.k8s.io
